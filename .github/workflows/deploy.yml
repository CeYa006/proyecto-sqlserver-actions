name: Despliegue SQL Server en Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ACCEPT_EULA: Y
  MSSQL_PID: Developer
  SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Iniciar contenedor de SQL Server
        run: |
          docker run -e "ACCEPT_EULA=$ACCEPT_EULA" \
                     -e "MSSQL_PID=$MSSQL_PID" \
                     -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
                     -p 1433:1433 \
                     --name sqlserver_instance \
                     -d mcr.microsoft.com/mssql/server:2022-latest

      - name: 3. Esperar a que SQL Server esté listo
        run: |
          echo "Esperando a que el motor de SQL Server inicie..."
          for i in {1..30}; do
            if docker exec sqlserver_instance /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" &> /dev/null; then
              echo "¡SQL Server está en línea!"
              break
            fi
            echo "Intento $i: Aún iniciando, esperando 2 segundos..."
            sleep 2
          done

      - name: 4. Copiar scripts SQL al contenedor
        run: |
          docker cp ./sql sqlserver_instance:/sql

      - name: 5. Ejecutar scripts SQL en orden
        run: |
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $SA_PASSWORD -C"
          docker exec sqlserver_instance $SQLCMD -i /sql/create_database.sql
          docker exec sqlserver_instance $SQLCMD -i /sql/create_tables.sql
          docker exec sqlserver_instance $SQLCMD -i /sql/create_procedure.sql
          docker exec sqlserver_instance $SQLCMD -i /sql/create_trigger.sql
          docker exec sqlserver_instance $SQLCMD -i /sql/test_data.sql
